name: AstroAI tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/metadata-location-time]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas scipy pillow
      - name: Run metadata and solver tests
        run: python -m pytest tests/test_exif_utils.py tests/test_solver.py -v
